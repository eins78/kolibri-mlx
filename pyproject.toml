[project]
name = "kolibri-mlx"
version = "0.1.0"
description = "MLX port of Aleph Alpha Kolibri 1 for mlx-lm: conversion, model file and numerical verification"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.33.0",
    "jinja2>=3.1.6",
    "mlx-lm>=0.30",
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=4.57",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
